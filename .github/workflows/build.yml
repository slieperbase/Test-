name: Android APK bauen

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Debug-APK bauen
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk LokaleKI.apk
      - name: APK prüfen (Prozessor-Architekturen, Signatur)
        run: |
          echo "Enthaltene native Bibliotheken:"
          unzip -l LokaleKI.apk | grep '\.so$' | awk '{print $4}' | cut -d/ -f2 | sort | uniq -c
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/aapt2 dump badging LokaleKI.apk | grep -E "^package|sdkVersion|native-code"
          $BT/apksigner verify --print-certs LokaleKI.apk | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: LokaleKI-debug-apk
          path: LokaleKI.apk
      - name: APK als Release veröffentlichen
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Lokale KI – aktuelle APK
          body: |
            Neueste Version der App. Lade **LokaleKI.apk** herunter und installiere sie auf deinem Android-Handy.
            (Stand: Commit ${{ github.sha }})
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          files: LokaleKI.apk
